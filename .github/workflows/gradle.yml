name: Gradle Build

on:
  push:
    tags:
      - v*.*.*

env:
  JAVA_VERSION: "25"
  BUILD_RELEASE: "true"

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Check Environment Variables
        run: env

      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-package: 'jdk+fx'
          java-version: ${{env.JAVA_VERSION}}
          distribution: 'zulu'

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Gradle Build
        run: ./gradlew clean build publishToMavenLocal --no-daemon --warning-mode all --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts
          path: build/libs

  release:
    needs: [ build ]
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Download
        uses: actions/download-artifact@v5
        with:
          path: out

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./**/**.jar
